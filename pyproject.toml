[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handleman-hq"
version = "0.2.0"
description = "The dark factory: a spec-driven, model-agnostic agent swarm for any repo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm]",
    "crewai-tools",
    "textual",
    "python-dotenv",
    "rich",
    # The ssh transport fallback (swarm/pyssh.py): an agent shell may be unable
    # to start /usr/bin/ssh at all, and the harness still has to push.
    "paramiko",
    "pynacl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
hq = "swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
